<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="30" fill="#071426"/>
  <text x="70" y="82" fill="#fff" font-size="36" font-weight="700" font-family="Arial,'PingFang SC'">标准需求：七个阶段，七次有证据的判断</text>
  <g font-family="Arial,'PingFang SC'" text-anchor="middle">
    <path d="M115 300H1080" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(115 300)"><circle r="46" fill="#0ea5e9"/><text y="10" fill="#fff" font-size="25">需求</text><text y="92" fill="#7dd3fc" font-size="17">范围 / 验收</text></g>
    <g transform="translate(275 300)"><circle r="46" fill="#3b82f6"/><text y="10" fill="#fff" font-size="25">设计</text><text y="92" fill="#93c5fd" font-size="17">代码 / 风险</text></g>
    <g transform="translate(435 300)"><circle r="46" fill="#6366f1"/><text y="10" fill="#fff" font-size="23">任务</text><text y="92" fill="#a5b4fc" font-size="17">Owner / 验证</text></g>
    <g transform="translate(595 300)"><circle r="46" fill="#8b5cf6"/><text y="10" fill="#fff" font-size="23">开发</text><text y="92" fill="#c4b5fd" font-size="17">diff / 自测</text></g>
    <g transform="translate(755 300)"><circle r="46" fill="#a855f7"/><text y="10" fill="#fff" font-size="23">测试</text><text y="92" fill="#d8b4fe" font-size="17">矩阵 / 结论</text></g>
    <g transform="translate(915 300)"><circle r="46" fill="#14b8a6"/><text y="10" fill="#fff" font-size="23">评审</text><text y="92" fill="#99f6e4" font-size="17">CI / 问题关闭</text></g>
    <g transform="translate(1080 300)"><circle r="46" fill="#22c55e"/><text y="10" fill="#fff" font-size="23">合入</text><text y="92" fill="#86efac" font-size="17">PR / commit</text></g>
  </g>
  <g font-family="Arial,'PingFang SC'"><rect x="180" y="465" width="840" height="105" rx="20" fill="#111f35" stroke="#334155"/><text x="225" y="510" fill="#94a3b8" font-size="19">每次流转都要同时回答：</text><text x="225" y="548" fill="#fff" font-size="22">谁批准？依据是什么？下一阶段为什么可以开始？</text></g>
  <text x="70" y="635" fill="#64748b" font-size="17" font-family="Arial,'PingFang SC'">大型需求在任务后增加“就绪评审”，在普通评审后增加“安全评审”。</text>
</svg>
