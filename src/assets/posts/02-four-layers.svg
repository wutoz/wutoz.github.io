    <g transform="translate(620 145)"><rect width="240" height="380" rx="24" fill="#251d45" stroke="#a78bfa"/><circle cx="50" cy="58" r="25" fill="#7c3aed"/><text x="50" y="67" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text><text x="90" y="67" fill="white" font-size="27" font-weight="700">Roles</text><text x="30" y="130" fill="#c4b5fd" font-size="21">明确</text><text x="30" y="170" fill="white" font-size="22">谁提出和实现？</text><text x="30" y="210" fill="white" font-size="22">谁验证和批准？</text><text x="30" y="290" fill="#94a3b8" font-size="18">职责分离 · 独立复核</text><text x="30" y="330" fill="#94a3b8" font-size="18">Agent / 具名 Owner</text></g>
